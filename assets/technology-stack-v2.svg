    </text>
    <path d="M277 121H459" stroke="#194d2d"/>

    <g font-family="monospace" font-size="13" fill="#e3f9e9">
      <rect x="277" y="140" width="5" height="5" rx="1" fill="#57e88e"/>
      <text x="292" y="147">PyTorch</text>

      <rect x="277" y="172" width="5" height="5" rx="1" fill="#57e88e"/>
      <text x="292" y="179">TensorFlow</text>

      <rect x="277" y="204" width="5" height="5" rx="1" fill="#57e88e"/>
      <text x="292" y="211">scikit-learn</text>

      <rect x="277" y="236" width="5" height="5" rx="1" fill="#57e88e"/>
