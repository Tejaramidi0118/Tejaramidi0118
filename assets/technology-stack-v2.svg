    </g>

    <path d="M511 270H693" stroke="#194d2d"/>
    <text x="511" y="286"
          font-family="monospace" font-size="11"
          fill="#62d990">INTELLIGENT SYSTEMS</text>
  </g>

  <!-- Category 4: Application development -->
