    <rect x="727" y="78" width="218" height="222" rx="10"
          fill="#041009" stroke="#287d49"/>

    <text x="745" y="108"
          font-family="Arial, Helvetica, sans-serif"
          font-size="16" font-weight="700" fill="#8bffb3">
      DEVELOPMENT
    </text>
    <path d="M745 121H927" stroke="#194d2d"/>

    <g font-family="monospace" font-size="13" fill="#e3f9e9">
      <rect x="745" y="140" width="5" height="5" rx="1" fill="#57e88e"/>
      <text x="760" y="147">Flask</text>

      <rect x="745" y="172" width="5" height="5" rx="1" fill="#57e88e"/>
      <text x="760" y="179">FastAPI</text>

      <rect x="745" y="204" width="5" height="5" rx="1" fill="#57e88e"/>
      <text x="760" y="211">REST APIs</text>

      <rect x="745" y="236" width="5" height="5" rx="1" fill="#57e88e"/>
      <text x="760" y="243">PostgreSQL</text>
