  </g>

  <!-- Footer accent -->
  <path d="M30 320H1170" stroke="url(#accent)" stroke-width="1.5"/>
  <circle cx="30" cy="320" r="3" fill="#8bffb3"/>
  <circle cx="1170" cy="320" r="3" fill="#8bffb3"/>

  <text x="600" y="340" text-anchor="middle"
        font-family="monospace" font-size="11"
        letter-spacing="2" fill="#62d990">
    DESIGN  ·  DEVELOP  ·  EVALUATE  ·  DEPLOY
  </text>
</svg>
