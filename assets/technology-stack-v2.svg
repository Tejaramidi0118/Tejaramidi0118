
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="350" viewBox="0 0 1200 350"
     role="img" aria-labelledby="title desc">

  <title id="title">Ramidi Teja — Technology Stack</title>
  <desc id="desc">Programming languages, machine learning frameworks, AI technologies, application development, and infrastructure tools.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030a06"/>
      <stop offset="100%" stop-color="#081b10"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36d879"/>
      <stop offset="100%" stop-color="#a5ffca"/>
    </linearGradient>

    <pattern id="grid" width="24" height="24"
             patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24"
            fill="none" stroke="#17452b"
            stroke-width="0.6" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="14"
        fill="url(#background)"/>
  <rect width="1200" height="350" rx="14"
        fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="348" rx="13"
        fill="none" stroke="#287d49"/>

  <!-- Header -->
  <text x="30" y="42"
        font-family="Arial, Helvetica, sans-serif"
        font-size="23" font-weight="700"
        letter-spacing="1.5" fill="#8bffb3">
    TECHNOLOGY STACK
  </text>

  <text x="1170" y="40" text-anchor="end"
        font-family="monospace" font-size="12"
        letter-spacing="1" fill="#62d990">
    LANGUAGES · AI · ENGINEERING
  </text>

  <path d="M30 59H1170"
        stroke="#24663d" stroke-width="1"/>

  <!-- Category 1: Languages -->
  <g>
    <rect x="25" y="78" width="218" height="222" rx="10"
          fill="#041009" stroke="#287d49"/>

    <text x="43" y="108"
          font-family="Arial, Helvetica, sans-serif"
          font-size="16" font-weight="700" fill="#8bffb3">
      LANGUAGES
    </text>
    <path d="M43 121H225" stroke="#194d2d"/>

    <g font-family="monospace" font-size="14" fill="#e3f9e9">
      <rect x="43" y="140" width="5" height="5" rx="1" fill="#57e88e"/>
      <text x="58" y="147">Python</text>

      <rect x="43" y="172" width="5" height="5" rx="1" fill="#57e88e"/>
      <text x="58" y="179">Java</text>

      <rect x="43" y="236" width="5" height="5" rx="1" fill="#57e88e"/>
      <text x="58" y="243">SQL</text>
    </g>

    <path d="M43 270H225" stroke="#194d2d"/>
    <text x="43" y="286"
          font-family="monospace" font-size="11"
          fill="#62d990">CORE PROGRAMMING</text>
  </g>

  <!-- Category 2: ML frameworks -->
  <g>
    <rect x="259" y="78" width="218" height="222" rx="10"
