      <rect x="979" y="172" width="5" height="5" rx="1" fill="#57e88e"/>
      <text x="994" y="179">Docker</text>

      <rect x="979" y="204" width="5" height="5" rx="1" fill="#57e88e"/>
      <text x="994" y="211">Google Cloud</text>

      <rect x="979" y="236" width="5" height="5" rx="1" fill="#57e88e"/>
