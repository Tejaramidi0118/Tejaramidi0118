<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Technical Profile — Ramidi Teja</title>
  <desc id="desc">A professional dashboard showing development focus, technical interests, and engineering mission.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030b07"/>
      <stop offset="100%" stop-color="#071b10"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39d879"/>
      <stop offset="100%" stop-color="#a5ffca"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#17452b" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="14" fill="url(#background)"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="13" fill="none" stroke="#287d49"/>

  <!-- Heading -->
  <text x="30" y="39"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21" font-weight="700"
        letter-spacing="1.5" fill="#8bffb3">TECHNICAL PROFILE</text>
  <path d="M30 55H1170" stroke="#24663d" stroke-width="1"/>

  <!-- Left: development focus -->
  <rect x="28" y="73" width="340" height="218" rx="10"
        fill="#041009" stroke="#287d49"/>

  <text x="49" y="104"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17" font-weight="700" fill="#8bffb3">DEVELOPMENT FOCUS</text>
  <path d="M49 117H346" stroke="#194d2d"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e3f9e9">
    <circle cx="53" cy="143" r="4" fill="#57e88e"/>
    <text x="68" y="148">Machine Learning Models</text>

    <circle cx="53" cy="176" r="4" fill="#57e88e"/>
    <text x="68" y="181">Deep Learning Pipelines</text>

    <circle cx="53" cy="209" r="4" fill="#57e88e"/>
    <text x="68" y="214">Model Evaluation</text>

    <circle cx="53" cy="242" r="4" fill="#57e88e"/>
    <text x="68" y="247">End-to-End AI Applications</text>

    <circle cx="53" cy="275" r="4" fill="#57e88e"/>
    <text x="68" y="280">Deployment and Integration</text>
  </g>

  <!-- Centre: engineering approach -->
  <g transform="translate(600 178)">
    <circle r="100" fill="#04150b" stroke="#3bd879" stroke-width="1.5"/>
    <circle r="82" fill="none" stroke="#267d49" stroke-dasharray="3 6"/>
    <circle r="62" fill="none" stroke="#267d49" stroke-dasharray="2 7"/>

    <path d="M-88 0H88 M0-88V88 M-60-60L60 60 M-60 60L60-60"
