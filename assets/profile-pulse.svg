  <path d="M853 117H1150" stroke="#194d2d"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e3f9e9">
    <circle cx="857" cy="139" r="3.5" fill="#57e88e"/>
    <text x="871" y="144">Artificial Intelligence &amp; ML</text>

    <circle cx="857" cy="163" r="3.5" fill="#57e88e"/>
    <text x="871" y="168">Natural Language Processing</text>

    <circle cx="857" cy="187" r="3.5" fill="#57e88e"/>
    <text x="871" y="192">Computer Vision</text>

    <circle cx="857" cy="211" r="3.5" fill="#57e88e"/>
    <text x="871" y="216">Geospatial Analytics</text>
  </g>

  <!-- Right: mission -->
  <rect x="832" y="237" width="340" height="54" rx="10"
        fill="#041009" stroke="#287d49"/>

  <text x="852" y="259"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14" font-weight="700" fill="#8bffb3">ENGINEERING MISSION</text>
  <text x="852" y="279"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13" fill="#e3f9e9">Build practical, reliable intelligent systems.</text>
</svg>
