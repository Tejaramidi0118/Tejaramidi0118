          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M29-31H43V-17"
          fill="none" stroke="#a5ffca" stroke-width="3"
          stroke-linecap="round"/>

    <circle cx="-40" cy="12" r="4" fill="#8bffb3"/>
    <circle cx="-12" cy="-20" r="4" fill="#8bffb3"/>
    <circle cx="12" cy="4" r="4" fill="#8bffb3"/>
    <circle cx="43" cy="-31" r="4" fill="#8bffb3"/>

    <text x="0" y="48" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="13" font-weight="700"
          letter-spacing="1" fill="#dfffea">IDEAS TO</text>
    <text x="0" y="66" text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="13" font-weight="700"
          letter-spacing="1" fill="#8bffb3">WORKING SYSTEMS</text>
  </g>

  <!-- Right: technical interests -->
  <rect x="832" y="73" width="340" height="150" rx="10"
        fill="#041009" stroke="#287d49"/>

  <text x="853" y="104"
        font-family="Arial, Helvetica, sans-serif"
