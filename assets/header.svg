
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-labelledby="title desc">

  <title id="title">Ramidi Teja — AI and Machine Learning</title>
  <desc id="desc">Dark green technology banner with a clean nameplate and subtle circuit graphics.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020806"/>
      <stop offset="55%" stop-color="#061a11"/>
      <stop offset="100%" stop-color="#020604"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3bd879"/>
      <stop offset="100%" stop-color="#b3ffd0"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28"
            fill="none" stroke="#1d7546"
            stroke-width="0.7" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- Circuit traces -->
  <g fill="none" stroke="#35dc7b" stroke-width="2" opacity="0.55">
    <path d="M0 55H65V80H100"/>
    <path d="M1200 65H1125V95H1090"/>
    <path d="M0 245H105V220H150"/>
    <path d="M1200 235H1100V255H1050"/>
  </g>

  <g fill="#35dc7b" opacity="0.8">
    <circle cx="65" cy="55" r="3"/>
    <circle cx="1125" cy="65" r="3"/>
    <circle cx="105" cy="245" r="3"/>
    <circle cx="1100" cy="235" r="3"/>
  </g>

  <!-- Main name -->
  <text x="72" y="145"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="800"
        letter-spacing="2"
        fill="#f3fff7">RAMIDI <tspan fill="url(#accent)">TEJA</tspan></text>

  <!-- Identity tags -->
  <text x="78" y="190"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        font-weight="600"
        letter-spacing="0.6"
        fill="#9bffc0">ARTIFICIAL INTELLIGENCE · MACHINE LEARNING · PROBLEM SOLVER</text>

  <path d="M78 211H835"
        stroke="#2c9b59"
        stroke-width="1.5"/>

  <!-- Right-side technical panel -->
  <g transform="translate(920 87)">
    <rect x="0" y="0" width="205" height="132" rx="8"
          fill="#031009" fill-opacity="0.55"
          stroke="#287d49" stroke-width="1.2"/>

    <g stroke="#49e889" stroke-width="1.5" fill="none">
      <path d="M18 30H38L46 22H63"/>
      <path d="M18 61H48L56 53H76"/>
      <path d="M18 92H38L46 84H63"/>
      <path d="M132 30H160V48H180"/>
      <path d="M132 61H150V79H180"/>
      <path d="M132 92H160V110H180"/>
    </g>

    <g fill="#8bffb3">
      <circle cx="63" cy="22" r="3"/>
      <circle cx="76" cy="53" r="3"/>
      <circle cx="63" cy="84" r="3"/>
      <circle cx="180" cy="48" r="3"/>
      <circle cx="180" cy="79" r="3"/>
      <circle cx="180" cy="110" r="3"/>
    </g>

    <g font-family="monospace" font-size="13" fill="#b3ffd0">
      <text x="83" y="34">LEARN</text>
      <text x="83" y="65">BUILD</text>
      <text x="83" y="96">SOLVE</text>
    </g>
  </g>

  <!-- Bottom-right accent -->
  <g transform="translate(1125 250)" fill="none" stroke="#46e889" opacity="0.75">
    <circle r="16"/>
    <circle r="25" stroke-dasharray="3 6"/>
    <path d="M-10 0H10M0-10V10"/>
  </g>

</svg>
